# /etc/nginx/sites-available/itabol — HTTPS reverse proxy in front of the
# application, which listens on 127.0.0.1:8000. Certificates e.g. from certbot.

limit_req_zone $binary_remote_addr zone=itabol_upload:10m rate=6r/m;

server {
    listen 80;
    server_name bold.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bold.example.org;

    ssl_certificate     /etc/letsencrypt/live/bold.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bold.example.org/privkey.pem;

    # Slightly above ITABOL_MAX_UPLOAD_MB; the application enforces the exact limit.
    client_max_body_size 6m;
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Optional access control for a closed user group:
    # auth_basic "BOLD enrichment";
    # auth_basic_user_file /etc/nginx/itabol.htpasswd;

    location = /api/upload {
        limit_req zone=itabol_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Enrichment of 100,000 specimens may take minutes.
        proxy_read_timeout 600s;
    }
}
