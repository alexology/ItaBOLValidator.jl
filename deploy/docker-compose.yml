# ItaBOLWeb with the image published on GitHub (nothing is built on the server):
#   docker compose up -d
# The port is bound to 127.0.0.1 for a reverse proxy on the same host; for
# HTTPS with Caddy use deploy/caddy/ instead. Put the geographic data in
# ./geodata next to this file (layout in deploy/layers.toml).
services:
  itabol:
    image: ghcr.io/alexology/itabolvalidator:latest
    restart: unless-stopped
    # Measured peak ~1.2 GB with 100 specimens and the national DEM.
    mem_limit: 2600m
    # Hardening (checked in CI with the same options): read-only image, no
    # capabilities, no privilege gain, at most 256 processes.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./geodata:/geodata:ro
      - work:/work
    environment:
      ITABOL_ALLOWED_HOSTS: itabol.example.org,127.0.0.1:8000
      # The port is reachable from this host only, i.e. through the local proxy,
      # which must set X-Forwarded-For (nginx: $proxy_add_x_forwarded_for).
      ITABOL_TRUST_FORWARDED: "true"
volumes:
  work:
