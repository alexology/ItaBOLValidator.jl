# ItaBOLWeb with the image published on GitHub (nothing is built on the server):
#   docker compose up -d
# The port is bound to 127.0.0.1 for a reverse proxy on the same host; for
# HTTPS with Caddy use deploy/caddy/ instead. Put the geographic data in
# ./geodata next to this file (layout in deploy/layers.toml).
services:
  itabol:
    image: ghcr.io/alexology/itabolvalidator:latest
    restart: unless-stopped
    # Measured peak ~1.2 GB with 100 specimens and the national DEM.
    mem_limit: 2600m
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./geodata:/geodata:ro
    environment:
      ITABOL_ALLOWED_HOSTS: itabol.example.org,127.0.0.1:8000
