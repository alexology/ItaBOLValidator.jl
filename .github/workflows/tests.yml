# Runs the package and web test suites on Linux (the development machine is
# Windows). Synthetic data only: no geographic dataset and no BOLD request.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13.4"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Package tests
        run: julia --project=. --threads=2 --check-bounds=yes -e 'using Pkg; Pkg.test()'
      - name: Web tests
        run: julia --project=web --threads=2 -e 'using Pkg; Pkg.test()'
