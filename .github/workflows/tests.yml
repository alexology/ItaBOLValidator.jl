# Runs the package and web test suites on Linux (the development machine is
# Windows). Synthetic data only: no geographic dataset and no BOLD request.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.13.4"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Package tests
        run: julia --project=. --threads=2 --check-bounds=yes -e 'using Pkg; Pkg.test()'
      - name: Web tests
        run: julia --project=web --threads=2 -e 'using Pkg; Pkg.test()'
