# Builds the container image of ItaBOLWeb (deploy/Dockerfile), starts it with
# the production hardening (read-only file system, no capabilities, no new
# privileges, process and memory limits) and checks it, then publishes it on
# the GitHub Container Registry as ghcr.io/alexology/itabolvalidator:
#   push to main  -> tags "main", "latest" and "sha-<commit>"
#   tag v1.2.3    -> tags "1.2.3" and "1.2"
#   every Monday  -> rebuilt, to pick up security updates of the base image
#   pull request  -> built and checked only, not published
# The image holds the code only: the geographic data are mounted at run time.
# Actions are pinned to commit SHAs (Dependabot keeps them up to date).

name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alexology/itabolvalidator

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: itabol:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container as in production
        run: |
          mkdir -p geodata                    # no data: the layers are reported unavailable
          docker volume create itabol-work
          docker run -d --name itabol --read-only --tmpfs /tmp:size=64m \
            -v "$PWD/geodata:/geodata:ro" -v itabol-work:/work \
            --security-opt no-new-privileges:true --cap-drop ALL --pids-limit 256 --memory 2600m \
            -e ITABOL_ALLOWED_HOSTS=127.0.0.1 -p 127.0.0.1:8000:8000 itabol:smoke
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:8000/health
      - name: Check uploads, limits and refusals
        run: |
          set -e
          base=http://127.0.0.1:8000
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          xlsx=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          test "$(code -X POST -H "Content-Type: $xlsx" -H "X-Filename: t.xlsx" \
                 --data-binary @test/data/BOLD5_BCDM_Specimen_Submission_SinglePage.xlsx $base/api/upload)" = 200
          # Deeply nested XML is refused (422), not a server error.
          python3 - <<'EOF'
          import io, zipfile
          src = zipfile.ZipFile("test/data/BOLD5_BCDM_Specimen_Submission_SinglePage.xlsx")
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as z:
              for n in src.namelist():
                  data = src.read(n)
                  if n == "xl/worksheets/sheet1.xml":
                      data = data.replace(b"</sheetData>", b"<row r=\"2\"><c r=\"A2\" t=\"inlineStr\"><is>"
                                          + b"<x>" * 200000 + b"</x>" * 200000 + b"</is></c></row></sheetData>")
                  z.writestr(n, data)
          open("deep.xlsx", "wb").write(buf.getvalue())
          EOF
          test "$(code -X POST -H "Content-Type: $xlsx" -H "X-Filename: d.xlsx" --data-binary @deep.xlsx $base/api/upload)" = 422
          test "$(code -X OPTIONS -H "Origin: https://evil.example" -H "Access-Control-Request-Method: POST" \
                 -H "Access-Control-Request-Headers: content-type,x-session" $base/api/upload)" = 204
          test "$(code -H "Host: evil.example" $base/health)" = 421
          curl -fsS -D - -o /dev/null $base/ | grep -i "permissions-policy"
          docker stats --no-stream itabol
      - name: Container log
        if: always()
        run: docker logs itabol 2>&1 | tail -60

  image:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
