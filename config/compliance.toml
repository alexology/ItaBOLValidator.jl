# Compliance rules evaluated for every specimen record (see `load_compliance`).
#
# A record is BOLD compliant when it passes every error rule of [bold]; it is
# ItaBOL compliant when it is BOLD compliant AND passes every error rule of
# [itabol]. Warnings are shown but never change compliance.
#
# Rule kinds:
#   required     columns = [...]           every column filled
#   any_of       columns = [...]           at least one column filled
#   unique       columns = [col]           filled values unique within the workbook (case and spaces ignored)
#   vocabulary   columns = [col], list = "<name in [lists]>" or values = [...]   filled values from the list (case ignored)
#   date         columns = [...]           filled values are YYYY-MM-DD dates
#   number       columns = [...]           filled values are decimal numbers (dot as separator)
#   coordinates  latitude = col, longitude = col, required = bool
#                decimal degrees, latitude in [-90, 90], longitude in [-180, 180], both or neither
#   pattern      columns = [...], regex = "..."   filled values match the regular expression
# Optional for every rule: severity = "error" (default) or "warning", note = "free text".

schema_version = 1

[bold]
title = "BOLD5 (BCDM)"
version = "2026-11-24"
defined = true
# BOLD has not published a list of required BCDM fields (the BCDM README lists
# "Add required fields" as pending). The required fields below are the minimum
# for a new record given in the BOLD v4 Handbook; formats follow the BCDM field
# definitions. Review this profile when BOLD publishes its requirements.
sources = [
    "BCDM field definitions, controlled vocabularies and country registry: https://github.com/boldsystems-central/BCDM (commit e990f6514f6f, 2025-06-12)",
    "BOLD Handbook v4 (Feb 2023), minimum data for a new record: https://v4.boldsystems.org/libhtml_v3/static/BOLD4_Handbook_FinalVersion_Feb2023.pdf",
    "BOLD FAQ (Sample ID and Phylum required): https://boldsystems.org/resource-hub/faq/",
]

[[bold.rules]]
kind = "required"
columns = ["SAMPLEID", "INST", "PHYLUM", "COUNTRY/OCEAN"]

[[bold.rules]]
kind = "any_of"
columns = ["FIELDID", "MUSEUMID"]

[[bold.rules]]
kind = "unique"
columns = ["SAMPLEID"]

[[bold.rules]]
kind = "vocabulary"
columns = ["COUNTRY/OCEAN"]
list = "bold_countries"

[[bold.rules]]
kind = "vocabulary"
columns = ["IDENTIFICATION_METHOD"]
list = "bold_identification_methods"

[[bold.rules]]
kind = "date"
columns = ["COLLECTION_DATE_START", "COLLECTION_DATE_END"]

[[bold.rules]]
kind = "number"
columns = ["ELEV", "DEPTH", "ELEV_ACCURACY", "DEPTH_ACCURACY", "COORD_ACCURACY"]

[[bold.rules]]
kind = "coordinates"
latitude = "COORD:LAT"
longitude = "COORD:LON"
required = false

# Capitalisation of taxon names (warnings only): capital initial for the genus and
# higher ranks, lower-case epithets.
[[bold.rules]]
kind = "pattern"
columns = ["PHYLUM", "CLASS", "ORDER", "FAMILY", "SUBFAMILY", "TRIBE", "GENUS"]
regex = "^[A-Z][a-z-]+$"
severity = "warning"
note = "iniziale maiuscola e resto minuscolo, es. Baetis"

[[bold.rules]]
kind = "pattern"
columns = ["SPECIES", "SUBSPECIES"]
regex = "^[A-Z][a-z-]+( [^A-Z ][^ ]*)+$"
severity = "warning"
note = "genere con iniziale maiuscola, epiteti minuscoli, es. Baetis rhodani"

[itabol]
title = "ItaBOL"
# The ItaBOL criteria have not been defined yet: no record is marked ItaBOL
# compliant until `defined = true` and the criteria are listed below.
version = ""
defined = false
sources = []
# Example of the syntax (not ItaBOL criteria):
# [[itabol.rules]]
# kind = "required"
# columns = ["COLLECTION_DATE_START", "COLLECTORS", "IDENTIFIED_BY"]
# [[itabol.rules]]
# kind = "coordinates"
# latitude = "COORD:LAT"
# longitude = "COORD:LON"
# required = true

